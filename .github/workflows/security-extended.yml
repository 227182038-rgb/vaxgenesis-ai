# Audit 4.4, 4.5 — Extended security scanning
#
# Extends the v1.0 security.yml workflow with:
#   - Gitleaks secret scanning
#   - Semgrep SAST
#   - License compliance check
#   - Dependency freshness check
#
# This workflow is ADDITIVE to the existing .github/workflows/security.yml.
# It does not duplicate the bandit / npm audit / Trivy scans already there.

name: Security — Extended (audit v1.1)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 6 AM UTC

jobs:
  # ============================================================
  # 4.4 — Secret scanning with Gitleaks
  # ============================================================
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for commit scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed for private repos

  # ============================================================
  # 4.5 — SAST with Semgrep
  # ============================================================
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/python
            p/typescript
            p/react
            p/sql-injection
            p/command-injection
            p/xss
            p/security-audit
          output: semgrep-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  # ============================================================
  # License compliance check
  # ============================================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-licenses
        run: pip install pip-licenses

      - name: Check backend licenses
        working-directory: apps/backend
        run: |
          pip install -e ".[dev]" --quiet || true
          pip-licenses --format=csv --output-file=backend-licenses.csv
          # Fail if any GPL/AGPL licenses are found (project is proprietary)
          if grep -iE "GPL|AGPL|SSPL" backend-licenses.csv; then
            echo "ERROR: Copyleft license detected — incompatible with proprietary license"
            exit 1
          fi

      - name: Check frontend licenses
        working-directory: apps/frontend
        run: |
          npm install --legacy-peer-deps --silent
          npx license-checker --csv --out frontend-licenses.csv
          if grep -iE "GPL|AGPL|SSPL" frontend-licenses.csv; then
            echo "ERROR: Copyleft license detected"
            exit 1
          fi

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            apps/backend/backend-licenses.csv
            apps/frontend/frontend-licenses.csv

  # ============================================================
  # Dependency freshness (outdated check)
  # ============================================================
  dependency-freshness:
    name: Dependency Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend — pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pip-audit
        working-directory: apps/backend
        run: |
          pip install pip-audit
          pip-audit --strict --require-hashes -r <(pip install -e ".[dev]" --dry-run -q 2>/dev/null | grep -oE '^[^ ]+') || true

      - name: Frontend — npm outdated
        working-directory: apps/frontend
        run: |
          npm install --legacy-peer-deps --silent
          npm outdated || true  # non-blocking; just report

  # ============================================================
  # 4.1 — E2E tests (Playwright)
  # ============================================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: vaxgenesis
          POSTGRES_USER: vaxgenesis
          POSTGRES_DB: vaxgenesis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend
        working-directory: apps/backend
        run: |
          pip install -e ".[dev]" --quiet
          alembic upgrade head
          python -m vaxgenesis.scripts.seed

      - name: Install frontend
        working-directory: apps/frontend
        run: npm install --legacy-peer-deps

      - name: Install Playwright
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+psycopg://vaxgenesis:vaxgenesis@localhost:5432/vaxgenesis
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: e2e-test-secret-key-must-be-at-least-32-characters
          ENVIRONMENT: test
          CORS_ORIGINS: http://localhost:3000
        run: uvicorn vaxgenesis.main:app --port 8000 &

      - name: Start frontend
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run start &

      - name: Wait for services
        run: |
          sleep 15
          curl -sf http://localhost:8000/api/v1/health
          curl -sf http://localhost:3000

      - name: Run Playwright tests
        working-directory: apps/frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/

  # ============================================================
  # 4.3 — Performance tests (k6)
  # ============================================================
  performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: vaxgenesis
          POSTGRES_USER: vaxgenesis
          POSTGRES_DB: vaxgenesis
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        working-directory: apps/backend
        run: pip install -e ".[dev]" --quiet

      - name: Run migrations + seed
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+psycopg://vaxgenesis:vaxgenesis@localhost:5432/vaxgenesis
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: perf-test-secret-key-must-be-at-least-32-characters
          ENVIRONMENT: test
          CORS_ORIGINS: http://localhost:3000
        run: |
          alembic upgrade head
          python -m vaxgenesis.scripts.seed

      - name: Start backend
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+psycopg://vaxgenesis:vaxgenesis@localhost:5432/vaxgenesis
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: perf-test-secret-key-must-be-at-least-32-characters
          ENVIRONMENT: test
        run: uvicorn vaxgenesis.main:app --port 8000 &

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415B36428D78414E8C74D7379F50
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 load test
        run: k6 run tests/perf/k6_load.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: tests/perf/k6_results.json
