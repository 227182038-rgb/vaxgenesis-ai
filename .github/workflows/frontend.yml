name: CI Frontend
on: { push: { branches: [main, develop] } }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
