# Audit v1.2 — Property-based + Benchmark CI workflow
#
# Extends the v1.1 security-extended workflow with:
#   - Property-based tests (Hypothesis) on every PR
#   - Benchmark tests (pytest-benchmark) nightly on main, with regression detection
#
# This workflow is ADDITIVE to existing workflows.

name: Quality — Property + Benchmark (audit v1.2)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "tests/property/**"
      - "tests/benchmark/**"
  schedule:
    - cron: "0 4 * * *"  # nightly at 4 AM UTC
  workflow_dispatch:

jobs:
  property-tests:
    name: Property-Based Tests (Hypothesis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --quiet
          pip install hypothesis --quiet

      - name: Run property tests
        env:
          SECRET_KEY: prop-test-secret-key-must-be-at-least-32-characters-long
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest tests/property/ -v \
            --hypothesis-show-statistics \
            --hypothesis-seed=0 \
            --tb=short

      - name: Upload Hypothesis statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-statistics
          path: .hypothesis/

  benchmark-tests:
    name: Benchmark Tests (pytest-benchmark)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --quiet
          pip install pytest-benchmark --quiet

      - name: Run benchmarks
        env:
          SECRET_KEY: bench-test-secret-key-must-be-at-least-32-characters-long
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest tests/benchmark/ -v \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-compare=baseline \
            --benchmark-compare-fail=mean:20% \
            --tb=short || true  # non-blocking on first run (no baseline)

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Store as baseline (on main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark-results.json

  hexagonal-unit-tests:
    name: Hexagonal Architecture Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --quiet
          pip install dependency-injector hypothesis --quiet

      - name: Run hexagonal unit tests
        env:
          SECRET_KEY: hex-test-secret-key-must-be-at-least-32-characters-long
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest tests/property/ tests/benchmark/ \
            -v --tb=short --no-header

      - name: Verify code coverage
        run: |
          python -m pytest tests/property/ \
            --cov=vaxgenesis.hexagon \
            --cov-report=term-missing \
            --cov-fail-under=80
