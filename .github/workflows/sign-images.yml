# Audit v2.0 — Sigstore / Cosign image signing
#
# Signs every container image with Cosign (Sigstore) using
# keyless signing (OIDC-based, no key management required).
# K8s admission controller (Kyverno) verifies signatures before
# admitting pods.

name: Sign Container Images (Cosign)

on:
  push:
    branches: [main]
    paths:
      - "apps/**"

jobs:
  sign:
    name: Sign with Cosign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # required for keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign backend image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Generate SLSA provenance attestation
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
        with:
          image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/sign-images.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
