name: Security
on: { push: { branches: [main] }, schedule: [{ cron: "0 0 * * 0" }] }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install bandit && bandit -r apps/backend/src -f json || true
      - run: cd apps/frontend && npm audit || true
